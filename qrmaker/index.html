<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRMaker — Generador de QR profesional</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #0ea5e9; }
    #qrcode { background: white; padding: 20px; border-radius: 12px; text-align: center; }
    .premium { background: #f59e0b; color: black; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .note { font-size: 14px; color: #94a3b8; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>QRMaker <span class="premium">PRO</span></h1>
    <p style="text-align:center">Genera códigos QR personalizados. 5 gratis al día • Premium = ilimitado</p>

    <div class="grid">
      <div>
        <label>Texto o URL</label>
        <input id="text" placeholder="https://ejemplo.com" value="https://qrmaker.vercel.app">

        <label>Color del QR</label>
        <input type="color" id="color" value="#000000">

        <label>Color de fondo</label>
        <input type="color" id="bg" value="#ffffff">

        <label>Tamaño</label>
        <select id="size">
          <option value="200">200px (gratis)</option>
          <option value="300">300px</option>
          <option value="500">500px (Premium)</option>
          <option value="800">800px (Premium)</option>
        </select>

        <button onclick="generate()">Generar QR</button>
        <button onclick="download()" style="background:#10b981">Descargar PNG</button>
        <button onclick="unlockPremium()" style="background:#f59e0b; color:black">Desbloquear Premium (demo)</button>
      </div>

      <div>
        <div id="qrcode"></div>
        <p class="note" id="status">Generaciones hoy: 0 / 5</p>
      </div>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('qr_count') || '0');
    let premium = localStorage.getItem('qr_premium') === 'true';
    updateStatus();

    function updateStatus() {
      document.getElementById('status').innerText = premium
        ? '✅ Premium activo — Generaciones ilimitadas'
        : `Generaciones hoy: ${count} / 5`;
    }

    function generate() {
      if (!premium && count >= 5) {
        alert('Límite diario alcanzado. Desbloquea Premium para continuar.');
        return;
      }
      const text = document.getElementById('text').value;
      const color = document.getElementById('color').value;
      const bg = document.getElementById('bg').value;
      const size = parseInt(document.getElementById('size').value);

      if (!premium && size > 300) {
        alert('Tamaños grandes son solo Premium');
        return;
      }

      const canvas = document.createElement('canvas');
      QRCode.toCanvas(canvas, text, {
        width: size,
        color: { dark: color, light: bg },
        errorCorrectionLevel: 'H'
      }, function (err) {
        if (err) return alert(err);
        document.getElementById('qrcode').innerHTML = '';
        document.getElementById('qrcode').appendChild(canvas);
        if (!premium) {
          count++;
          localStorage.setItem('qr_count', count);
          updateStatus();
        }
      });
    }

    function download() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return alert('Genera un QR primero');
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function unlockPremium() {
      localStorage.setItem('qr_premium', 'true');
      premium = true;
      updateStatus();
      alert('Premium desbloqueado (modo demo). En producción conectarías Stripe aquí.');
    }

    generate(); // generar uno inicial
  </script>
</body>
</html>
