<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CountdownPro — Cuentas atrás para lanzamientos</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e1b4b, #312e81); color: white; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .timer { font-size: 4rem; font-weight: bold; letter-spacing: 2px; margin: 30px 0; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; }
    input, button { padding: 14px; margin: 8px; border-radius: 8px; border: none; font-size: 16px; }
    input { width: 250px; }
    button { background: #818cf8; color: white; cursor: pointer; font-weight: bold; }
    .premium { background: #fbbf24; color: black; }
    #page { display: none; }
  </style>
</head>
<body>
  <div class="container" id="builder">
    <h1>CountdownPro</h1>
    <p>Crea una página de cuenta atrás bonita para tu lanzamiento, evento o oferta</p>

    <div>
      <input id="title" placeholder="Título del evento" value="Lanzamiento de mi producto">
      <br>
      <input id="date" type="datetime-local">
      <br>
      <input id="bg" type="color" value="#312e81">
      <button onclick="create()">Crear cuenta atrás</button>
      <button class="premium" onclick="unlock()">Quitar marca (Premium demo)</button>
    </div>
  </div>

  <div class="container" id="page">
    <h1 id="eventTitle"></h1>
    <div class="timer" id="timer">00d 00h 00m 00s</div>
    <p id="watermark" style="opacity:0.6; font-size:14px;">Creado con CountdownPro</p>
    <button onclick="share()">Copiar enlace de esta página</button>
    <button onclick="location.reload()">Crear otra</button>
  </div>

  <script>
    let premium = localStorage.getItem('cd_premium') === 'true';
    let targetDate = null;

    // set default date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('date').value = tomorrow.toISOString().slice(0,16);

    function create() {
      const title = document.getElementById('title').value;
      const dateStr = document.getElementById('date').value;
      if (!dateStr) return alert('Elige una fecha');

      targetDate = new Date(dateStr);
      document.getElementById('eventTitle').innerText = title;
      document.body.style.background = document.getElementById('bg').value;

      document.getElementById('builder').style.display = 'none';
      document.getElementById('page').style.display = 'block';

      if (premium) document.getElementById('watermark').style.display = 'none';

      updateTimer();
      setInterval(updateTimer, 1000);

      // save in URL for sharing (simple)
      const params = new URLSearchParams({
        t: title,
        d: targetDate.getTime(),
        c: document.getElementById('bg').value.replace('#',''),
        p: premium ? '1' : '0'
      });
      history.replaceState(null, '', '?' + params.toString());
    }

    function updateTimer() {
      if (!targetDate) return;
      const now = new Date();
      const diff = targetDate - now;
      if (diff <= 0) {
        document.getElementById('timer').innerText = '¡LLEGÓ EL MOMENTO!';
        return;
      }
      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff / (1000*60*60)) % 24);
      const mins = Math.floor((diff / (1000*60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      document.getElementById('timer').innerText =
        `${days}d ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`;
    }

    function unlock() {
      localStorage.setItem('cd_premium', 'true');
      premium = true;
      alert('Premium activado. La marca desaparecerá.');
      if (document.getElementById('page').style.display === 'block') {
        document.getElementById('watermark').style.display = 'none';
      }
    }

    function share() {
      navigator.clipboard.writeText(location.href);
      alert('Enlace copiado. Compártelo.');
    }

    // load from URL if present
    const params = new URLSearchParams(location.search);
    if (params.get('d')) {
      document.getElementById('title').value = params.get('t') || 'Evento';
      document.getElementById('date').value = new Date(parseInt(params.get('d'))).toISOString().slice(0,16);
      document.getElementById('bg').value = '#' + (params.get('c') || '312e81');
      if (params.get('p') === '1') premium = true;
      create();
    }
  </script>
</body>
</html>
